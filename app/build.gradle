plugins {
    id 'com.android.application'
}

// 发布签名：从项目根 keystore.properties 读取（该文件已 gitignore、含口令、不入库）。
// 文件不存在时跳过签名配置，assembleRelease 退化为产出未签名包，避免他机/CI 构建失败。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.xiefeihong.volumecontrol'
    compileSdk 35

    defaultConfig {
        applicationId "com.xiefeihong.volumecontrol"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.1"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError false
        // 本机 lint 工具链初始化崩溃（UastFacade），非代码缺陷；跳过 release 的 lintVital，
        // 使 ./gradlew assembleRelease 可直接产出已签名发布包。
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    // libxposed 新版 API（102）：仅编译期需要，运行期由 LSPosed 注入
    compileOnly 'io.github.libxposed:api:102.0.0'
}
